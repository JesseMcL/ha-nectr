[project]
name = "ha-nectr"
version = "0.2.0"
description = "Home Assistant integration importing Nectr hourly usage into long-term statistics"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.nectr"]
force-sort-within-sections = true
combine-as-imports = true

[tool.coverage.run]
source = ["custom_components.nectr"]
